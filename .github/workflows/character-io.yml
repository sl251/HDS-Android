name: Character import and export
on:
  pull_request:
    paths: ['apps/mobile-ui/**', 'packages/**', 'android/**', 'tests/**', '.github/workflows/character-io.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: character-io-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Exercise actual import and export screens
        run: |
          node tests/import-code-ui.mjs
          node tests/character-export-ui.mjs
      - run: npx cap sync android
      - name: Android compilation and persistence tests
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon compileReleaseKotlin testReleaseUnitTest --tests '*CharacterDocumentTest'
