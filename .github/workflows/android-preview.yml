name: Android development preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'apps/**', 'packages/**', 'runtime/**', 'scripts/build-mobile-host.mjs', 'scripts/build-runtime.py', 'tests/**', 'package*.json', 'capacitor.config.ts', 'vite.config.ts', 'tsconfig.json', 'index.html', '.github/workflows/android-preview.yml']
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.1'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install fixed JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and test actual HDS host
        run: |
          mkdir -p artifacts
          npm test 2>&1 | tee artifacts/host-tests.log
          npm run build
          npx cap sync android
      - name: Test runtime archive policy
        run: |
          python3 tests/runtime-pack.test.py
          python3 tests/guest-openssl-config.test.py
      - name: Verify and retain actual preview.1 rootfs regression input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.0-preview.1 --repo "$GITHUB_REPOSITORY" --pattern '*arm64.apk' --dir "$RUNNER_TEMP/legacy-hds"
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          apk = next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'legacy-hds').glob('*.apk'))
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == 'd6b70ce404c5fa38870434c64759a542994c7e7f113163978b11b2f4cce5ba46'
          with zipfile.ZipFile(apk) as source:
              (pathlib.Path(os.environ['RUNNER_TEMP']) / 'rootfs-preview1.bundle').write_bytes(source.read('assets/runtime/rootfs.bundle'))
          PY
      - name: Ensure Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Compile Android bridge before runtime packaging
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon compileReleaseKotlin
      - name: Build checksum-verified ARM64 runtime
        run: python3 scripts/build-runtime.py
      - name: Restore private signing key
        env:
          HDS_SIGNING_STORE_B64: ${{ secrets.HDS_SIGNING_STORE_B64 }}
        run: |
          test -n "$HDS_SIGNING_STORE_B64"
          printf '%s' "$HDS_SIGNING_STORE_B64" | base64 --decode > "$RUNNER_TEMP/hds-preview.keystore"
      - name: Build signed APK and run Android checks
        env:
          HDS_LEGACY_ROOTFS: ${{ runner.temp }}/rootfs-preview1.bundle
          HDS_SIGNING_STORE: ${{ runner.temp }}/hds-preview.keystore
          HDS_SIGNING_PASSWORD: ${{ secrets.HDS_SIGNING_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon lintRelease testReleaseUnitTest assembleRelease :app:assembleDebugAndroidTest
      - name: Package verification and release materials
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/HDS-Android-0.1.0-preview.4-arm64.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs artifacts/*.apk > artifacts/apk-signature.txt
          cp runtime/generated/runtime-manifest.json artifacts/
          cp docs/TEST-ON-PHONE.md artifacts/
          cp fixtures/cards/*.json fixtures/cards/*.yml artifacts/
          git archive --format=tar HEAD | gzip -n > artifacts/HDS-Android-0.1.0-preview.4-source.tar.gz
          cd artifacts
          sha256sum *.apk *.tar.gz > SHA256SUMS.txt
      - name: Upload preview and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HDS-Android-preview-${{ github.sha }}
          path: |
            artifacts/
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/tests/testReleaseUnitTest/
          if-no-files-found: error
          retention-days: 30
